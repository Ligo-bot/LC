<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LC · 口语精听 | Web3 玻璃质感</title>
    <style>
        :root{
            --bg:#f0f4f1;
            --card:rgba(255,255,255,0.65);
            --text:#1f2924;
            --sub-text:#555;
            --border:rgba(255,255,255,0.3);
            --btn-gradient:linear-gradient(135deg,#22c55e,#16a34a);
            --btn-light:rgba(34,197,94,0.12);
            --active-bg:rgba(34,197,94,0.18);
            --shadow:0 8px 32px rgba(22,163,74,0.1);
        }
        [data-theme="dark"]{
            --bg:#0c1410;
            --card:rgba(30,41,35,0.55);
            --text:#e8f1ec;
            --sub-text:#a3b8af;
            --border:rgba(255,255,255,0.08);
            --btn-gradient:linear-gradient(135deg,#22c55e,#15803d);
            --btn-light:rgba(34,197,94,0.15);
            --active-bg:rgba(34,197,94,0.22);
            --shadow:0 8px 32px rgba(0,0,0,0.25);
        }
        *{
            margin:0;padding:0;box-sizing:border-box;
            font-family:system-ui,-apple-system,sans-serif;
            transition:background 0.4s ease,color 0.4s ease;
        }
        body{
            min-height:100vh;
            background:var(--bg);
            display:flex;justify-content:center;padding:16px;
        }
        .app-wrap{
            width:100%;max-width:440px;
        }
        .glass-card{
            background:var(--card);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid var(--border);
            border-radius:24px;
            box-shadow:var(--shadow);
            padding:20px;margin-bottom:16px;
        }
        .top-bar{
            display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;
        }
        .top-title{
            font-size:18px;font-weight:600;color:var(--text);
        }
        .theme-btn{
            padding:6px 12px;border-radius:30px;border:none;
            background:var(--btn-light);color:#22c55e;font-size:13px;cursor:pointer;
        }
        video{
            width:100%;border-radius:16px;background:#000;display:block;
        }
        .input-box{
            display:flex;gap:8px;margin:14px 0;
        }
        input{
            flex:1;padding:10px 14px;border-radius:12px;
            border:1px solid var(--border);background:var(--card);
            color:var(--text);outline:none;
        }
        .btn-row{
            display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;
        }
        .btn{
            padding:10px;border:none;border-radius:12px;font-size:14px;cursor:pointer;
        }
        .btn-primary{
            background:var(--btn-gradient);color:#fff;
        }
        .btn-ghost{
            background:var(--btn-light);color:#22c55e;
        }
        .sent-item{
            padding:12px 14px;border-radius:14px;background:transparent;
            border:1px solid transparent;margin:8px 0;cursor:pointer;
        }
        .sent-item.active{
            background:var(--active-bg);border-color:rgba(34,197,94,0.25);
        }
        .en-text{
            font-size:15px;color:var(--text);line-height:1.5;
        }
        .cn-text{
            font-size:13px;color:var(--sub-text);margin-top:4px;
        }
        .wave-wrap{
            display:flex;gap:10px;margin:12px 0;
        }
        .wave-item{
            flex:1;height:56px;border-radius:12px;background:var(--btn-light);
            display:flex;align-items:center;justify-content:center;font-size:13px;color:#22c55e;
        }
        .tip{
            text-align:center;font-size:12px;color:var(--sub-text);margin-top:8px;
        }
    </style>
</head>
<body>
<div class="app-wrap">
    <div class="glass-card">
        <div class="top-bar">
            <div class="top-title">🎧 口语精听跟读</div>
            <button class="theme-btn" id="themeBtn">🌓 深浅切换</button>
        </div>

        <video id="video" controls></video>

        <div class="input-box">
            <input id="videoUrl" placeholder="粘贴抖音/B站原生链接">
            <button class="btn btn-primary" onclick="parseAndPlay()">解析播放</button>
        </div>
        <div class="tip">支持：抖音 v.douyin.com | B站 BV 链接</div>

        <div class="btn-row">
            <button class="btn btn-ghost" onclick="prevSent()">上一句</button>
            <button class="btn btn-ghost" onclick="nextSent()">下一句</button>
            <button class="btn btn-primary" onclick="toggleSingleLoop()">单句循环</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-ghost" onclick="setSpeed(0.75)">0.75x</button>
            <button class="btn btn-ghost" onclick="setSpeed(1)">1.0x</button>
            <button class="btn btn-ghost" onclick="setSpeed(1.5)">1.5x</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="startRecord()">录音跟读</button>
            <button class="btn btn-ghost" onclick="playRecord()">回放</button>
            <button class="btn btn-ghost" onclick="abToggle()">AB循环</button>
        </div>

        <div class="wave-wrap">
            <div class="wave-item">原声波形</div>
            <div class="wave-item">我的发音</div>
        </div>

        <div id="subContainer"></div>
    </div>
</div>

<script>
// 主题切换
const themeBtn = document.getElementById('themeBtn');
const html = document.documentElement;
themeBtn.onclick = ()=>{
    if(html.getAttribute('data-theme') === 'dark'){
        html.removeAttribute('data-theme');
        localStorage.theme = "light";
    }else{
        html.setAttribute('data-theme','dark');
        localStorage.theme = "dark";
    }
}
if(localStorage.theme === "dark") html.setAttribute('data-theme','dark');

// 全局
const video = document.getElementById('video');
let subList = [];
let curIdx = 0;
let singleLoop = false;
let aPoint = null,bPoint = null;
let recorder,recordUrl;

// 内置字幕
subList = [
    {en:"I found the fastest way to improve oral English.",cn:"我发现口语进步最快的方式。",start:0,end:4},
    {en:"Practice 20 minutes every single day.",cn:"每天坚持练习20分钟。",start:4,end:8},
    {en:"Imitation and repetition are the key.",cn:"模仿与重复是核心关键。",start:8,end:12}
];

// ==============================================
// 稳定解析：抖音 / B站（已修复 黑屏/不播放 问题）
// ==============================================
async function parseAndPlay(){
    const input = document.getElementById('videoUrl').value.trim();
    if(!input) return alert("请粘贴视频链接");

    try {
        // 稳定公共解析接口
        const apiUrl = `https://api.kkjsz.cn/api/v1/parse?url=${encodeURIComponent(input)}`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        let playUrl = "";
        
        // 自动适配抖音/B站返回格式
        if(data?.data?.url) playUrl = data.data.url;
        else if(data?.url) playUrl = data.url;
        else {
            alert("解析失败，换个视频链接试试");
            return;
        }

        // 关键修复：先加载 → 再播放
        video.src = playUrl;
        video.load();
        
        // 视频就绪后自动播放
        video.onloadeddata = () => {
            video.play().catch(() => {});
            alert("✅ 解析成功，已开始播放！");
        };

    } catch (e) {
        alert("❌ 解析失败：链接不支持或平台限制");
        console.error(e);
    }
}

// 渲染字幕
function renderSub(){
    const wrap = document.getElementById('subContainer');
    wrap.innerHTML = "";
    subList.forEach((item,i)=>{
        const div = document.createElement('div');
        div.className = "sent-item " + (i===curIdx?"active":"");
        div.onclick = ()=>jumpSent(i);
        div.innerHTML = `
            <div class="en-text">${item.en}</div>
            <div class="cn-text">${item.cn}</div>
        `;
        wrap.appendChild(div);
    })
}

// 句子控制
function jumpSent(i){
    curIdx = i;
    video.currentTime = subList[curIdx].start;
    renderSub();
}
function prevSent(){if(curIdx>0) jumpSent(curIdx-1);}
function nextSent(){if(curIdx < subList.length-1) jumpSent(curIdx+1);}

// 单句循环
function toggleSingleLoop(){
    singleLoop = !singleLoop;
    alert("单句循环："+(singleLoop?"开启✅":"关闭❌"));
}
// AB循环
function abToggle(){
    if(!aPoint){
        aPoint = video.currentTime;
        alert("A点已设置");
    }else if(!bPoint){
        bPoint = video.currentTime;
        alert("B点已设置，AB循环开启");
    }else{
        aPoint = null;bPoint = null;
        alert("AB循环已清除");
    }
}

// 倍速
function setSpeed(val){
    video.playbackRate = val;
}

// 时间轴监听
video.ontimeupdate = function(){
    if(singleLoop){
        let s = subList[curIdx];
        if(video.currentTime > s.end) video.currentTime = s.start;
    }
    if(aPoint!==null && bPoint!==null){
        if(video.currentTime > bPoint) video.currentTime = aPoint;
    }
}

// 录音
async function startRecord(){
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    let chunks = [];
    recorder.ondataavailable = e=>chunks.push(e.data);
    recorder.onstop = ()=>{
        recordUrl = URL.createObjectURL(new Blob(chunks));
    }
    recorder.start();
    alert("开始跟读录音");
}
function playRecord(){
    if(recordUrl) new Audio(recordUrl).play();
}

renderSub();
</script>
</body>
</html>
