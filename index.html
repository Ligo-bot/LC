<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LC · 口语精听 | Web3 玻璃质感</title>
    <style>
        :root{
            --bg:#f0f4f1;
            --card:rgba(255,255,255,0.65);
            --text:#1f2924;
            --sub-text:#555;
            --border:rgba(255,255,255,0.3);
            --btn-gradient:linear-gradient(135deg,#22c55e,#16a34a);
            --btn-light:rgba(34,197,94,0.12);
            --active-bg:rgba(34,197,94,0.18);
            --shadow:0 8px 32px rgba(22,163,74,0.1);
        }
        [data-theme="dark"]{
            --bg:#0c1410;
            --card:rgba(30,41,35,0.55);
            --text:#e8f1ec;
            --sub-text:#a3b8af;
            --border:rgba(255,255,255,0.08);
            --btn-gradient:linear-gradient(135deg,#22c55e,#15803d);
            --btn-light:rgba(34,197,94,0.15);
            --active-bg:rgba(34,197,94,0.22);
            --shadow:0 8px 32px rgba(0,0,0,0.25);
        }
        *{
            margin:0;padding:0;
            box-sizing:border-box;
            font-family:system-ui,-apple-system,sans-serif;
            transition:background 0.4s ease,color 0.4s ease;
        }
        body{
            min-height:100vh;
            background:var(--bg);
            display:flex;
            justify-content:center;
            padding:16px;
        }
        .app-wrap{
            width:100%;
            max-width:440px;
        }
        .glass-card{
            background:var(--card);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border:1px solid var(--border);
            border-radius:24px;
            box-shadow:var(--shadow);
            padding:20px;
            margin-bottom:16px;
        }
        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:16px;
        }
        .top-title{
            font-size:18px;
            font-weight:600;
            color:var(--text);
        }
        .theme-btn{
            padding:6px 12px;
            border-radius:30px;
            border:none;
            background:var(--btn-light);
            color:#22c55e;
            cursor:pointer;
        }
